name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest --cov=src/ctr --cov-report=term-missing --cov-fail-under=85

  end-to-end-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run the offline pipeline on the committed sample
        run: |
          python -m ctr.cli ingest --offline
          python -m ctr.cli analyze
          python -m ctr.cli brief
          python -m ctr.cli export
      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: sample-pipeline-artifacts
          path: |
            reports/
            exports/
