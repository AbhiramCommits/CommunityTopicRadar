name: Scheduled weekly scrape

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  weekly-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STACKEXCHANGE_SITE: stats
      SCRAPE_PAGES: "65"
      DATABASE_URL: sqlite:///data/community.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Refresh data and reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m ctr.cli ingest
          python -m ctr.cli analyze
          python -m ctr.cli brief
          python -m ctr.cli export
      - name: Upload refreshed reports and exports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-community-topic-radar
          path: |
            reports/
            exports/
          retention-days: 90
